# UNVALIDATED: never run on GitHub (no network when written). Expect to fix small things on first run.
# Action versions are major tags; pin to commit SHAs before production use.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + mypy (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q
      - name: mypy
        run: python -m mypy src

  eval-smoke:
    name: offline evaluation smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: offline guard matrix (no network, no API key)
        run: PYTHONPATH=src python -m ota.evals matrix
      - name: retrieval ablation
        run: PYTHONPATH=src python -m ota.evals retrieval

  security:
    name: dependency audit + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit (runtime deps)
        run: pip-audit -r requirements.txt
      - name: regex secret scan (backstop; use a real scanner such as gitleaks in production)
        run: python tools/scan_secrets.py

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  iac-scan:
    name: trivy config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Known, documented PoC exceptions (ADR-0007) go in .trivyignore with a reason each.

  docker:
    name: docker build + image scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ota-agent:ci .
      - name: smoke test the container
        run: |
          docker run -d --name ota -p 8080:8080 ota-agent:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/readyz && break; sleep 1; done
          curl -fsS localhost:8080/healthz
          docker logs ota
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ota-agent:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
