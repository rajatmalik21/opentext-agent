# UNVALIDATED and manual-only. Authenticates to Azure with OIDC federation: no client secret is stored.
# One-time setup (not automated here): an Entra app registration with a federated credential for this repo and
# environment, Contributor on the resource group, and repository/environment VARIABLES (not secrets):
# AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID. Protect the `dev`/`prod` environments with required reviewers.
name: deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # required-reviewer approval is configured on the environment
    defaults:
      run:
        working-directory: infra/terraform
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - name: init
        run: terraform init -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" -backend-config="container_name=tfstate" -backend-config="key=ota-agent.${{ inputs.environment }}.tfstate" -backend-config="use_azuread_auth=true"
      - name: build image in ACR (no docker daemon on the runner needed)
        run: |
          ACR=$(terraform output -raw acr_name)
          az acr build -r "$ACR" -t "ota-agent:${GITHUB_SHA}" ../..
      - name: plan
        run: terraform plan -var "subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" -var "env=${{ inputs.environment }}" -var deploy_app=true -var "image_tag=${GITHUB_SHA}" -out=tfplan
      - name: apply
        run: terraform apply -auto-approve tfplan
