[project]
name = "ota-agent"
version = "0.1.0"
description = "Assessment PoC: grounded support-content agent for OpenText supported products"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.31",
  "pydantic>=2.6",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Phase 2+: API, model client. Not installable in the build sandbox (network off).
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "anthropic>=0.40"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "types-requests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py312"
